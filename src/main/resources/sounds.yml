# Game event -> sound. Retune here, no code changes needed.
#
#   key        sound event from our sounds.json (cookieclicker:...), or "@block" (see below)
#   fallback   vanilla minecraft:... sound, used when the pack isn't loaded
#   volume     0 < volume <= 1.0 (above 1.0 only widens the hearing range; the files are already levelled)
#   pitch-min / pitch-max   random pitch range per play (0.5 - 2.0, min <= max)
#   source     sound category, lower case: master, music, record, weather, block, hostile,
#              neutral, player, ambient, voice, ui
#
# "@block" plays the vanilla place sound of the block the event is about; `fallback` is used
# if it can't be resolved. Only events that pass a block support it (house_block_place).
# All sounds are mono, so they can be played at a location.

cookie_click:
  key: "cookieclicker:ui.cookie_click"
  fallback: "minecraft:block.wood.hit"
  volume: 0.6
  pitch-min: 0.92
  pitch-max: 1.08
  source: ui

cookie_crit:
  key: "cookieclicker:ui.cookie_crit"
  fallback: "minecraft:entity.experience_orb.pickup"
  volume: 0.8
  pitch-min: 0.97
  pitch-max: 1.03
  source: ui

purchase:
  key: "cookieclicker:ui.purchase"
  fallback: "minecraft:block.note_block.bell"
  volume: 0.8
  pitch-min: 0.98
  pitch-max: 1.02
  source: ui

cant_afford:
  key: "cookieclicker:ui.cant_afford"
  fallback: "minecraft:block.note_block.bass"
  volume: 0.6
  pitch-min: 0.95
  pitch-max: 1.0
  source: ui

house_hammer:
  key: "cookieclicker:house.hammer"
  fallback: "minecraft:block.anvil.place"
  volume: 0.4
  pitch-min: 1.15  # authored for ~1.25
  pitch-max: 1.35
  source: block

house_block_land:
  key: "cookieclicker:house.block_land"
  fallback: "minecraft:block.wood.place"
  volume: 0.5
  pitch-min: 0.9
  pitch-max: 1.1
  source: block

house_block_place:
  key: "@block"  # the landed block's own place sound
  fallback: "minecraft:block.stone.place"
  volume: 0.45
  pitch-min: 0.8
  pitch-max: 0.95
  source: block

house_fanfare:
  key: "cookieclicker:house.fanfare"  # fixed pitch: keeps the chord in tune
  fallback: "minecraft:ui.toast.challenge_complete"
  volume: 0.8
  pitch-min: 1.0
  pitch-max: 1.0
  source: ui

house_chimney_crackle:
  key: "cookieclicker:house.chimney_crackle"  # 3.0 s loop: replay every 60 ticks, fixed pitch
  fallback: "minecraft:block.campfire.crackle"
  volume: 0.5
  pitch-min: 1.0
  pitch-max: 1.0
  source: ambient

factory_ambient:
  key: "cookieclicker:factory.ambient"  # 4.0 s loop: replay every 80 ticks, fixed pitch
  fallback: "minecraft:block.furnace.fire_crackle"
  volume: 0.3
  pitch-min: 1.0
  pitch-max: 1.0
  source: ambient

belt_loop:
  key: "cookieclicker:factory.belt_loop"  # authored for pitch 0.8 = 5.0 s: replay every 100 ticks, fixed pitch
  fallback: "minecraft:block.beehive.work"
  volume: 0.2
  pitch-min: 0.8
  pitch-max: 0.8
  source: ambient

upgrade_shelved:
  key: "cookieclicker:ui.upgrade_shelved"
  fallback: "minecraft:block.amethyst_block.chime"
  volume: 0.6
  pitch-min: 0.97
  pitch-max: 1.05
  source: ui

bulk_toggle:
  key: "cookieclicker:ui.bulk_toggle"
  fallback: "minecraft:ui.button.click"
  volume: 0.5
  pitch-min: 0.97
  pitch-max: 1.05
  source: ui

basket_tier_up:
  key: "cookieclicker:ui.basket_tier_up"
  fallback: "minecraft:entity.player.levelup"
  volume: 0.8
  pitch-min: 1.0
  pitch-max: 1.0
  source: ui

building_appear:
  key: "cookieclicker:building.appear"
  fallback: "minecraft:block.wood.place"
  volume: 0.6
  pitch-min: 0.95
  pitch-max: 1.08
  source: block

building_milestone:
  key: "cookieclicker:building.milestone"
  fallback: "minecraft:ui.toast.challenge_complete"
  volume: 0.8
  pitch-min: 1.0
  pitch-max: 1.0
  source: block
