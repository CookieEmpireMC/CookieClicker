# Format: docs/balance/model.md. IDs only; display names live in messages.yml. Tuned with mise run balance.
click:
  base-power: 1
  crit-chance: 0.05
  crit-multiplier: 10        # a crit multiplies the whole click value
upgrades:
  # Repeatable: cost of the next level = ceil(cost × cost-growth ^ level); effect is per level.
  bakers_strength:
    cost: 200
    cost-growth: 1.25
    max-level: 50
    effect: { type: click-add, value: 1 }
    unlock: { building: villager_baker, owned: 1 }
  # One-time click tools (GDD §4.4). Each shows up at about half its price.
  wooden_spatula:
    cost: 100
    effect: { type: click-add, value: 1 }
    unlock: { building: villager_baker, owned: 1 }
  stone_rolling_pin:
    cost: 500
    effect: { type: click-add, value: 2 }
    unlock: { baked: 250 }
  iron_rolling_pin:
    cost: 5000
    effect: { type: click-add, value: 5 }
    unlock: { baked: 2500 }
  golden_glove:
    cost: 50000
    effect: { type: click-add, value: 20 }
    unlock: { baked: 25000 }
  diamond_fingers:
    cost: 500000
    effect: { type: click-add, value: 100 }
    unlock: { baked: 250000 }
  netherite_hands:
    cost: 5000000
    effect: { type: click-add, value: 500 }
    unlock: { baked: 2500000 }
  # Handy Fingers: each click also gives a share of CPS. Totals 1 % / 3 % / 5 % (values add up).
  # II and III belong to the Shipping Centre / Alchemy Lab era (after Rebirth 1 in the GDD).
  handy_fingers_1:
    cost: 25000000           # GDD 50M: lands ~2h20 casual, between Netherite Hands and the Cocoa Plantation
    effect: { type: click-cps-fraction, value: 0.01 }
    unlock: { baked: 10000000 }
  handy_fingers_2:
    cost: 5000000000
    effect: { type: click-cps-fraction, value: 0.02 }
    unlock: { baked: 2500000000 }
  handy_fingers_3:
    cost: 500000000000
    effect: { type: click-cps-fraction, value: 0.02 }
    unlock: { baked: 250000000000 }
  # The Recipe Book: one-time, adds no CPS itself. Once bought, the ingredient buildings (buildings.yml `produces`)
  # start producing and the recipes below can show. Unlocks with the Cow Barn / Sugar Cane Field tier.
  recipe_book:
    cost: 15000
    effect: { type: recipes-unlock }   # no value
    unlock: { baked: 10000 }
# Recipes (GDD §4.5): one-time, bought in the Recipe Book GUI with cookies AND ingredients (all or nothing).
# Shown once the Recipe Book is owned and baked >= unlock.baked. Values add up and multiply total CPS:
# CPS = Σ building CPS × (1 + Σ bought recipe values) (docs/balance/model.md). value 0.02 = +2 % CPS.
# Ingredient amounts are a few minutes of production of the producers owned when the recipe shows; the cookie cost
# pays back about as fast as the buildings on offer then. Listed in unlock order (the sum order for golden values).
recipes:
  butter:
    cost: 3000
    ingredients: { milk: 200 }
    effect: { type: cps-percent, value: 0.02 }
    unlock: { baked: 10000 }
  oatmeal:
    cost: 10000
    ingredients: { flour: 1500 }
    effect: { type: cps-percent, value: 0.02 }
    unlock: { baked: 25000 }
  brown_sugar:
    cost: 100000
    ingredients: { sugar: 2000 }
    effect: { type: cps-percent, value: 0.03 }
    unlock: { baked: 100000 }
  caramel:
    cost: 1000000
    ingredients: { sugar: 5000, milk: 5000 }
    effect: { type: cps-percent, value: 0.03 }
    unlock: { baked: 1000000 }
  macadamia:
    cost: 10000000
    ingredients: { eggs: 2500, sugar: 20000 }
    effect: { type: cps-percent, value: 0.04 }
    unlock: { baked: 25000000 }
  hazelnut:
    cost: 20000000
    ingredients: { flour: 50000, chocolate: 2000 }
    effect: { type: cps-percent, value: 0.04 }
    unlock: { baked: 50000000 }
  chocolate_chips:
    cost: 30000000
    ingredients: { chocolate: 4000 }
    effect: { type: cps-percent, value: 0.05 }
    unlock: { baked: 100000000 }
