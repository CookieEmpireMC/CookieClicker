# Click values and upgrades (format: docs/balance/model.md). IDs only; display names live in messages.yml.
# Tuned with tools/balance (mise run balance); see docs/balance/report-*.md.
click:
  base-power: 1              # cookies per click before upgrades
  crit-chance: 0.05          # 5 % of clicks are crispy crits
  crit-multiplier: 10        # a crit multiplies the whole click value
upgrades:
  # Repeatable: cost of the next level = ceil(cost × cost-growth ^ level); effect is per level.
  bakers_strength:
    cost: 200
    cost-growth: 1.25
    max-level: 50
    effect: { type: click-add, value: 1 }
    unlock: { building: villager_baker, owned: 1 }
  # One-time click tools (GDD §4.4). Each shows up at about half its price.
  wooden_spatula:
    cost: 100
    effect: { type: click-add, value: 1 }
    unlock: { building: villager_baker, owned: 1 }
  stone_rolling_pin:
    cost: 500
    effect: { type: click-add, value: 2 }
    unlock: { baked: 250 }
  iron_rolling_pin:
    cost: 5000
    effect: { type: click-add, value: 5 }
    unlock: { baked: 2500 }
  golden_glove:
    cost: 50000
    effect: { type: click-add, value: 20 }
    unlock: { baked: 25000 }
  diamond_fingers:
    cost: 500000
    effect: { type: click-add, value: 100 }
    unlock: { baked: 250000 }
  netherite_hands:
    cost: 5000000
    effect: { type: click-add, value: 500 }
    unlock: { baked: 2500000 }
  # Handy Fingers: each click also gives a share of CPS. Totals 1 % / 3 % / 5 % (values add up).
  handy_fingers_1:
    cost: 50000000
    effect: { type: click-cps-fraction, value: 0.01 }
    unlock: { baked: 25000000 }
  handy_fingers_2:
    cost: 5000000000
    effect: { type: click-cps-fraction, value: 0.02 }
    unlock: { baked: 2500000000 }
  handy_fingers_3:
    cost: 500000000000
    effect: { type: click-cps-fraction, value: 0.02 }
    unlock: { baked: 250000000000 }
