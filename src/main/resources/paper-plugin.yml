name: CookieClicker
version: '${version}'
main: dev.casperrs.cookieClicker.CookieClicker
# Downloads the JDBC drivers (cookieclicker-libraries.properties) through Paper's Maven Central mirror
loader: dev.casperrs.cookieClicker.CookieClickerLoader
api-version: '26.3'
load: POSTWORLD
description: Cookie Empire - a per-player cookie bakery.

dependencies:
  server:
    # WorldGuard 7.0.20+ (with WorldEdit 7.4.6+ or FAWE 2.16+). BEFORE: it is loaded first, so onLoad can register
    # the bakery-plot / bakery-house / bakery-farm flags before WorldGuard enables; join-classpath lets us see com.sk89q.*
    WorldGuard:
      load: BEFORE
      required: true
      join-classpath: true

permissions:
  cookieempire.admin:
    description: Set up bakery plots, houses and farms, and reload Cookie Empire.
    default: op
  cookieclicker.teleport:
    description: Travel with /bakery farm and /bakery home.
    default: true
