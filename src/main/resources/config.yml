# Get url + sha1 from `mise run pack` and wherever you host the zip. Empty url/sha1 = not sent (vanilla fallbacks).
resource-pack:
  url: ""
  sha1: ""
  # false = don't send it (e.g. merged into ItemsAdder's pack);
  enabled: true
  # true = players who decline are kicked by the client prompt
  required: false

database:
  type: h2
  table-prefix: cc_
  autosave-seconds: 300
  shutdown-save-timeout-seconds: 10
  h2:
    file: data/cookies
  mariadb:
    host: localhost
    port: 3306
    database: cookieclicker
    username: cookieclicker
    password: ""
    parameters: ""
    # Max open connections
    pool-size: 4

# Action bar
hud:
  enabled: true

# A player's own cookie, pedestal and panels spawn within this many blocks of their pedestal
station:
  view-distance: 24
  click-distance: 6

plot:
  hide-others-near-pedestal:
    enabled: false
    radius: 6
  # Bought buildings stand on the plot (slots: houses/building-slots.yml), seen only by their owner
  buildings:
    enabled: true

house:
  # /bakery plot setup and /bakery house place refuse designs bigger than this (x * y * z blocks)
  max-blocks: 40000
  cinematic:
    enabled: true
    camera: true
  chimney:
    smoke: true
  steam:
    enabled: true
  ambient:
    # Oven humming
    enabled: true
    radius: 24.0

belt:
  enabled: true
  max-cookies: 8

# The countryside (/bakery farm setup <id> in a region with the bakery-farm <id> flag)
farm:
  # Seconds between two /bakery farm or /bakery home teleports per player (0 = no cooldown)
  teleport-cooldown-seconds: 5
  paste:
    # Blocks the setup places per tick; lower it if the server lags during a setup
    blocks-per-tick: 5000
  wheel:
    # Turns per minute of the mill's waterwheel (0..10, 0 = still)
    rpm: 2
    # The wheel exists only while a player with the resource pack is within this many blocks (8..256)
    view-range: 64

debug:
  log-click-events: false
