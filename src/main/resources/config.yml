# Cookie Empire (CookieClicker) - main config.
# Balance (costs, CPS, click power, crits) lives in buildings.yml / upgrades.yml, sounds in sounds.yml,
# all text in messages.yml. Apply changes with /bakery reload (except database.*: restart the server).

database:
  # h2 (embedded file, no setup) or mariadb
  type: h2
  # Prefix for every table (letters, digits, _)
  table-prefix: cc_
  # Save every online player's cookies this often (they are also saved on quit and on shutdown)
  autosave-seconds: 300
  # On shutdown, wait at most this long for pending saves to finish
  shutdown-save-timeout-seconds: 10
  h2:
    # Relative to plugins/CookieClicker/ (H2 adds .mv.db)
    file: data/cookies
  mariadb:
    host: localhost
    port: 3306
    database: cookieclicker
    username: cookieclicker
    password: ""
    # Extra JDBC URL parameters, e.g. "sslMode=trust"
    parameters: ""

hud:
  # Action bar with cookies and cookies per second (text in messages.yml: hud.*)
  enabled: true
  # Re-send the action bar every N seconds (production always ticks once per second)
  refresh-seconds: 1

# Every plot's pedestal is a "station": the anchor of each player's own cookie, pedestal and shop panel.
# /bakery plot setup places it from the design's layout (saved in plots.yml). With a layout the cookie stands on the
# layout pedestal and the panel on the layout shop spot: only the "up" part of the offsets below is used.
station:
  # (unused since /bakery plot setup; kept for hand-edited plots.yml pedestals)
  snap-to-block: true
  # Round your facing to this many degrees (0 = exact)
  snap-yaw-degrees: 90

  # --- Per-player visuals (only the owner sees their own cookie and panel) ---
  # Positions are [right, up, forward] in blocks from the pedestal point, as seen by the admin who set it
  # (forward = the way you faced). Players stand on your side and look the same way.
  # Spawn a player's bakery when they are within this many blocks of the pedestal
  view-distance: 24
  # How often (ticks) to check who is near which station and to update the panel
  refresh-ticks: 20
  # Clicks from further away than this (blocks, eye to hitbox) are ignored
  click-distance: 6
  cookie:
    # Centre of the cookie
    offset: [0, 1.8, 2.5]
    # Size: 1.0 = about one block wide
    scale: 1.4
    # Idle bob up and down (blocks) and how long one bob takes (ticks)
    bob-amplitude: 0.1
    bob-period-ticks: 80
    # One full turn takes this many seconds (0 = no spin; max 120 degrees per segment)
    spin-seconds-per-revolution: 6
    # Spin/bob is sent as one interpolated segment this many ticks long (no teleports)
    segment-ticks: 10
    # Extra size of the click hitbox around the cookie (blocks)
    hitbox-margin: 0.1
    # Render distance multiplier (1.0 = 64 blocks)
    view-range: 0.5
    # Light level 0-15 the cookie is drawn with (15 = always fully lit)
    brightness: 15
    # The click effect ("+1", crumbs) starts this far (blocks) out of the cookie toward the player
    click-effect-offset: 0.1
  pedestal:
    enabled: true
    # Any block, as block data
    block: "minecraft:polished_deepslate"
    # Bottom centre of the pedestal, and its size in blocks
    offset: [0, 0, 2.5]
    width: 0.9
    height: 0.95
  panel:
    # Bottom centre of the header text; rows go down from there
    offset: [1.9, 2.55, 2.5]
    # Degrees added to the text / icon facing, in case they show mirrored or edge-on in game
    text-yaw-offset: 0
    icon-yaw-offset: 0
    header-scale: 0.6
    text-scale: 0.5
    # Header and row text look: light level 0-15, drop shadow, visible through blocks, and the client's
    # default (chat-style) background instead of the colours below
    text-brightness: 15
    text-shadow: true
    text-see-through: false
    text-default-background: false
    # Text wraps after this many pixels
    line-width: 120
    # First row sits this far below the header, each further row this much lower
    first-row-drop: 0.45
    row-pitch: 0.4
    row:
      # Relative to the row's anchor: [right, up, forward]
      # text-offset is the LEFT EDGE of the row's text background when text-left-edge is true (keep it just right of
      # the icon: icon centre + icon-scale / 2 + a small gap), else the centre of the text block.
      text-offset: [-0.3, 0, 0]
      # true = every row's text starts at text-offset, however long or wrapped it is (the plugin estimates the
      # rendered width from the default font and shifts the text right by half of it); false = text centred
      text-left-edge: true
      icon-offset: [-0.5, 0.13, -0.02]
      icon-scale: 0.3
      # Bottom centre of the row's click box; keep it clear of the cookie's box. It should cover the icon and the
      # text: from about icon-offset - icon-scale / 2 to text-offset + line-width * text-scale / 40
      hitbox-offset: [0.25, -0.02, 0]
      hitbox-width: 1.7
      hitbox-height: 0.34
    # Text background colours, "#AARRGGBB" (alpha below 1A is invisible)
    colors:
      header: "#C0301A0C"
      affordable: "#B03A2A10"
      unaffordable: "#B0202020"
      locked: "#90181818"
    # Icon light level 0-15: bright when affordable, dimmed otherwise
    icon-brightness:
      affordable: 15
      unaffordable: 5
    view-range: 0.5
    # Vanilla item shown as the row icon to players without our resource pack (with the pack they see
    # cookieclicker:building/<id>)
    icons:
      villager_baker:
        fallback-material: BREAD
      wheat_farm:
        fallback-material: WHEAT
    # For buildings not listed above
    default-fallback-material: COOKIE

# Our resource pack (3D cookie, icons, HUD glyph, sounds). Sent on join next to other plugins' packs
# (e.g. ItemsAdder's); vanilla fallbacks are used when a player declines it.
# Get url + sha1 from `mise run pack` and wherever you host the zip. Empty url/sha1 = not sent.
resource-pack:
  # false = don't send it (e.g. our assets are merged into ItemsAdder's pack); then any loaded server pack
  # counts as "has our pack"
  enabled: true
  url: ""
  # SHA-1 of the zip, 40 hex characters
  sha1: ""
  # true = players who decline are kicked by the client prompt
  required: false
  # messages.yml path of the prompt text shown with the pack request
  prompt: resource-pack.prompt
  # Wait this many ticks after join before sending (lets other plugins' packs go first)
  send-delay-ticks: 20

# Bakery plots: WorldGuard regions with the flag bakery-plot <id> (the house: bakery-house <id>).
# Points (viewpoint, pedestal, chimney) live in plots.yml. See docs/integrations.md for the region setup.
plot:
  # /bakery plot show: outline of the plot and house regions, only for you
  show:
    # Blocks between outline points (grows automatically for big regions, see max-points)
    particle-step: 1.0
    duration-seconds: 15
    # Replay the outline this often (ticks)
    redraw-ticks: 20
    # At most this many points per outline (12 to 2000; every edge keeps at least one point)
    max-points: 120
    # effects.yml presets played at every outline point
    plot-effect: plot_outline
    house-effect: house_outline
  # (unused since /bakery plot setup sets every smoke point)
  chimney-reach: 16
  # Players near a pedestal don't see other players near the same pedestal (less clutter). Off by default.
  hide-others-near-pedestal:
    enabled: false
    # Blocks around the pedestal point
    radius: 6
    # How often to check (ticks)
    check-ticks: 10

house:
  # /bakery plot setup and /bakery house place: refuse designs whose box (x * y * z), or layouts whose area (x * z),
  # is bigger than this
  max-blocks: 40000
  # First-visit build cinematic, seen only by that player (the house itself never changes)
  cinematic:
    enabled: true
    # enter-plot: start when the player walks onto the plot outside the house
    # viewpoint: start once the player has been moved to the plot's viewpoint
    trigger: enter-plot
    # Move the player to the plot's viewpoint (from the layout, set by /bakery plot setup) when it starts, so the
    # build is always seen from the same spot
    teleport-to-viewpoint: true
    # trigger viewpoint: a teleport must end within this many blocks of the viewpoint
    viewpoint-radius: 2.0
    # Blocks that start falling per tick (0.5 = one every other tick). Each landing is ~12 particles + 3 sounds,
    # so keep it modest. Tuned for the factory (~600-1200 blocks): about 17-30 seconds at 2.25 with the layer
    # delay below. The small cottage (170 blocks) is over in a few seconds; use 1 for it.
    blocks-per-tick: 2.25
    # Falling block displays alive at once per player (1-24; 24 is the effects engine's cap)
    max-falling-displays: 24
    # Pause before the first layer and after each layer has landed (ticks)
    layer-delay-ticks: 5
    # Play the hammer sound on every n-th landing (0 = never)
    hammer-every: 3
    # Keep the player out of the (invisible but solid) house: hold (stand still), slow, none.
    # A move into a still-hidden block is always refused.
    keep-out: hold
    # keep-out slow: movement speed change (-1 = stand still, 0 = normal speed)
    slow-amount: -0.7
    # Fake-air blocks sent per tick when hiding the house (and when re-sending it)
    fake-air-per-tick: 4096
    # Re-send fake air for still-hidden blocks this often (ticks, 0 = off)
    refresh-hidden-ticks: 40
    # After a click within this many blocks of the house, re-send fake air
    reassert-radius: 2
    # Confetti bursts this many blocks above the top of the house region
    confetti-height: 1.0
    # Watch the build from the layout's raised camera point (layout.camera, saved in plots.yml by /bakery plot setup):
    # the player is put in spectator mode, locked to that point, and gets their own game mode back at the viewpoint
    # when it ends (or on their next join, if the server stopped mid-build). Plots without a camera point, or false
    # here: watched from the ground as before.
    camera: true
  # Chimney smoke at every smoke point of the plot (plots.yml chimney / smoke, set by /bakery house place), shown
  # to every player in the plot who isn't watching the cinematic
  chimney:
    smoke: true
    # Replay the crackle sound every n-th smoke puff (the smoke puffs every 10 ticks; 0 = no sound)
    crackle-every: 6
  # Factory steam (factory_steam effect) at every steam point of the plot (plots.yml steam)
  steam:
    enabled: true
    # Ticks between the start of one vent and the next, so vents don't puff together
    every: 7
  # Low oven hum (factory_ambient sound) for players in the plot near the factory
  ambient:
    enabled: true
    # Ticks between plays (the sound is a 4 second loop)
    every: 80
    # Only players within this many blocks of the first steam point (or the house centre) hear it
    radius: 24.0
  # /bakery plot setup: the fence style is houses/fence.yml (data folder first, then the plugin's copy).

# The conveyor belt from the factory hatch to the pedestal (layout.belt; placed by /bakery plot setup with the frame
# from houses/belt.yml). Everyone sees the same moving belt surface; the cookies on it are your own, driven by your CPS.
# Purely visual: belt cookies don't add cookies. Only runs while you're in the plot (and not watching the build).
belt:
  enabled: true
  # Your cookies on the belt at once (0 = surface only, no cookies)
  max-cookies: 8
  # Size of a belt cookie (1.0 = one block)
  cookie-scale: 0.45
  # CPS -> belt. t = log(1 + cps) / log(1 + cps-scale), capped at 1 (0 CPS = no cookies).
  #   speed    = speed.min + (speed.max - speed.min) * t           (blocks per second)
  #   interval = interval.max - (interval.max - interval.min) * t  (ticks between two cookies)
  # So the belt is slow with a cookie now and then at first, and at full speed from cps-scale CPS on.
  speed:
    min: 0.6
    max: 2.5
  interval:
    min: 8
    max: 80
  cps-scale: 1000
  # Ticks between belt_loop plays while your belt runs (the sound is a 5 second loop: 100; 0 = silent). Heard within
  # house.ambient.radius of the belt.
  sound-every: 100
  # Belt surface item for players without our resource pack (a vanilla item name)
  fallback-item: BLACK_CARPET
  # Degrees added to the belt surface's facing. Set 180 if the slats move toward the hatch instead of the pedestal.
  surface-yaw: 0

debug:
  # Log every click event on a bakery hitbox (which events fire, who tracks the entity). For testing.
  log-click-events: false
