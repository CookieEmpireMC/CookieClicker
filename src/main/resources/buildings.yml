# Format: docs/balance/model.md. IDs only; display names live in messages.yml. Tuned with mise run balance.
cost-growth: 1.15            # cost multiplier per building already owned
# A building's own production doubles at each owned count; a building's own `milestones: [...]` replaces this list.
milestones: [10, 25, 50, 100, 150, 200]
# Unlocks stand in for the plot expansions (GDD §5): about the cookies baked when the matching expansion would be
# bought. Mid/late tiers are a little slower than GDD §4.2 (docs/balance/report-2026-10-22.md).
# Keep buildings in cost / unlock order: the shop's default view relies on the file order.
buildings:
  wheat_farm:                # Wheat Field
    base-cost: 15
    base-cps: 0.15           # GDD 0.1: payback 100 s like the Apprentice, so it's a real first buy
    unlock: { baked: 0 }
  villager_baker:            # Baker's Apprentice
    base-cost: 75            # GDD 100: first Apprentice within ~20 s of clicking (targets.md)
    base-cps: 1
    unlock: { baked: 0 }
  cow_barn:
    base-cost: 1100
    base-cps: 8
    unlock: { baked: 10000 }
  sugar_cane_field:
    base-cost: 12000
    base-cps: 47
    unlock: { baked: 10000 }
  industrial_oven:
    base-cost: 160000
    base-cps: 240
    unlock: { baked: 750000 }
  extra_belt:
    base-cost: 2000000
    base-cps: 1300
    unlock: { baked: 750000 }
  beehive:
    base-cost: 30000000
    base-cps: 6000
    unlock: { baked: 25000000 }
  cocoa_plantation:
    base-cost: 400000000
    base-cps: 40000
    unlock: { baked: 25000000 }
  shipping_centre:
    base-cost: 5100000000
    base-cps: 260000
    unlock: { baked: 1000000000 }
  alchemy_lab:
    base-cost: 75000000000
    base-cps: 1600000
    unlock: { baked: 1000000000 }
  portal_bakery:
    base-cost: 1000000000000
    base-cps: 10000000
    unlock: { baked: 100000000000 }
