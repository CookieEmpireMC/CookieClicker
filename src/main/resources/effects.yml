# Cookie Empire visual effects: effect ID -> layers. Retune here, no code changes needed; /bakery reload applies it.
# Owned by the vfx-designer. Code plays effects only by ID: effects.play("<id>", location, viewer, placeholders).
# Full reference with examples: design/effects.md (keep both in sync with the loader, EffectsConfigParser).
#
# Bad values are logged at load and fall back to the default; an unknown type/particle/shape/item skips that layer;
# an effect with no valid layer is skipped. Effects missing from this file are taken from the plugin's built-in copy.
# Units: distances in blocks, angles in degrees, times in ticks (20 ticks = 1 s), colours "#rrggbb" ("#aarrggbb"
# where transparency makes sense).
#
# limits:
#   max-particles-per-effect         (200)  particles one play may spawn; heavier effects are thinned at load
#   max-display-entities-per-player  (8)    effect display entities alive per viewer; the oldest is removed early
#   max-display-entities-global      (150)  effect display entities alive on the server; new ones are dropped
#   max-falling-blocks-per-player    (24)   effects.dropBlock displays falling at once per viewer; more land instantly
#   max-falling-blocks-global        (240)  the same, server-wide
#   max-loops-per-player             (8)    effects.loop loops per viewer; more are not started (logged once)
#
# Every preset: { layers: [...] } plus
#   loop-every   (none)       ticks between plays when code runs it with effects.loop(id, loc, viewer); a preset
#                             without it loops every 20 ticks. play() ignores it.
#   min-interval-ticks (0)    rate cap: play() shows this preset at most once per n ticks per viewer (shared for
#                             viewer = null); plays in between are dropped. 0 = no cap. For effects fired very
#                             often (belt_arrive). Loops ignore it.
#
# Every layer: { type: <type>, ... } plus
#   delay-ticks  (0)          start this many ticks after play
#   origin       ([0, 0, 0])  offset from the play location, [x, y, z]
#
# type: particle  -- personal particles (only the viewer sees them; everyone nearby when viewer is null)
#   particle     (required)   26.3 particle key: dust, item, end_rod, firework, wax_on, electric_spark, ...
#   data, depending on the particle:
#     dust                    color ("#ffffff"), size (1.0, 0.01-4)
#     dust_color_transition   color, to-color (= color), size
#     item                    item ("cookie", a vanilla item), item-model (optional, e.g. cookieclicker:cookie;
#                             only used for viewers with our resource pack, others see the vanilla item)
#     block, falling_dust, dust_pillar, block_crumble, block_marker:  block (required, e.g. oak_planks)
#     entity_effect, flash, tinted_leaves:  color
#     effect, instant_effect  color, power (1.0)
#     dragon_breath, sculk_charge, shriek:  value
#   shape        (point)      point | burst | sphere | ring | arc | line | helix | fountain | sparkles
#   points       (8)          points per tick (ring, sphere) or in total (burst, arc, line, helix per strand,
#                             fountain); sparkles: number of sparks; point: unused (see count)
#   radius       (0.5)        size of the shape; ring/sphere grow from radius-start (= radius) to radius
#   radius-start (= radius)   ring/sphere start radius (ease-out growth over duration-ticks)
#   duration-ticks (1)        ticks the shape is drawn over: ring/sphere redraw every tick (cost x ticks);
#                             burst/arc/line/helix/fountain spread their points over the ticks; point repeats;
#                             sparkles: life of one spark
#   height       (1.0)        helix height / sparkle rise
#   turns        (1.0)        helix revolutions;  strands (1): helix strands
#   angle        (180)        arc length;  start-angle (0): first angle of ring/arc/helix (0 = +x)
#   spread       (30)         fountain cone half-angle around straight up
#   up-bias      (0)          burst: 0 = full sphere, 1 = everything straight up
#   to           ([0, 1, 0])  line end, relative to the origin
#   plane        (horizontal) ring/arc: horizontal | vertical | facing (stands up and turns toward the viewer)
#   stagger-ticks (0)         sparkles: start times spread over this many ticks
#   emit-every   (1)          sparkles: emit each spark every n ticks (2 = half the particles)
#   direction    (outward for burst/fountain, else none)
#                none: particle placed on the point, then count / offset / speed are vanilla randomness
#                outward: launched along the shape normal at speed (blocks/tick); up: launched straight up
#   speed        (0)          launch speed (outward/up) or vanilla random speed (none)
#   offset       (0)          vanilla random spread around each point (direction none only)
#   count        (1)          particles per point (direction none only)
#   force        (false)      send in the extended range (and ignore the viewer's particle setting), like vanilla
#                             campfire smoke; for effects seen from afar (chimney smoke)
#   cost = points over all ticks x count; checked against max-particles-per-effect at load.
#
# type: floating-text  -- one TextDisplay (only the viewer sees it) that pops in, rises and fades
#   text         (required)   MiniMessage; placeholders from code, e.g. <amount> (inserted as plain text)
#   rise         (0.8)        blocks risen over its life
#   duration-ticks (20)       life until removed (at least start-tick + pop-in-ticks + 1 + fade-ticks)
#   scale        (1.0)        text size (1.0 = about 0.2 block per line)
#   pop-in-ticks (3)          grow from pop-in-scale (0.5) through overshoot (1.15) to scale; 0 = no pop-in
#   fade-ticks   (6)          shrink to nothing at the end, text opacity steps down meanwhile
#   start-tick   (1)          first animation tick (the client needs the spawn state first)
#   spread       (0.2)        rapid repeats fan out on a disc this wide, so numbers don't stack
#   shadow (true), see-through (false), background ("#00000000" = none), billboard (center), view-range (0.5)
#   cost: 1 display entity for duration-ticks
#
# type: item-crumbs  -- small ItemDisplays that fly out in a cone, tumble and shrink away
#   item ("cookie"), item-model (optional, as for particles), count (4, max 16), scale (0.2), distance (0.7),
#   spread (60, cone half-angle), lift (0.2), drop (0.5), spin (150, max 200), duration-ticks (14),
#   start-tick (1), view-range (0.5)
#   cost: count display entities for duration-ticks
#
# type: scale-pop  -- squash/stretch of the display passed to effects.pop(display, viewer); play() ignores it
#   steps        list of { scale: [x, y, z] or a number, ticks: n }, multipliers of the display's rest scale;
#                a final { scale: 1, ticks: 3 } is added if the last step isn't 1. Only the scale is changed.
#
# type: block-drop  -- how effects.dropBlock(viewer, blockData, target, onLanded) animates a falling block; used
#   from the house_block_drop preset; play() ignores it. A BlockDisplay (viewer only) anchored at the target block's
#   corner spawns drop-height above it, then 3 client-interpolated segments: fall, bounce + squash, settle.
#   start-tick   (2)          first segment tick (>= 1: the client needs the spawn state first); the block hangs
#                             in the air until then
#   drop-height  (4.0)        blocks above the target it starts (0-16)
#   fall-ticks   (6)          fall time; the impact is at start-tick + fall-ticks
#   bounce-height (0.25)      how high it pops back up after the impact (0 = squash only)
#   bounce-ticks (2)          bounce time
#   squash       ([1.08, 0.85, 1.08])  width/height/depth at the top of the bounce (0.25-2; one number = all
#                             three), centred on the block
#   settle-ticks (2)          back to rest; at start-tick + fall + bounce + settle the display is removed and the
#                             caller's onLanded runs in the same tick
#   impact-effect (house_block_land)  effect ID played for the viewer at the block's bottom centre on impact;
#                             none = no effect
#   impact-particles (4)      block particles of the dropped block itself on impact (0-32)
#   brightness   (auto)       auto = light just above the highest block of the target column; or [block, sky]
#                             0-15 each, e.g. [15, 15] for full bright
#   view-range   (1.0)        display view range (1.0 = 64 blocks)
#   cost: 1 BlockDisplay per falling block for its fall (counts toward max-falling-blocks-*), plus the impact

limits:
  max-particles-per-effect: 200
  max-display-entities-per-player: 8
  max-display-entities-global: 150
  max-falling-blocks-per-player: 24
  max-falling-blocks-global: 240
  max-loops-per-player: 8

# Click on the giant cookie: a few cookie crumbs pop off the hit point and fall, and "+<amount>" floats up.
# Spammable, so tiny: 8 particles + 1 text.
cookie_click:
  layers:
    - { type: particle, particle: item, item: cookie, item-model: "cookieclicker:cookie", shape: burst,
        points: 8, radius: 0.12, up-bias: 0.35, speed: 0.13 }
    - { type: floating-text, text: "<#f5c542>+<amount>", origin: [0, 0.35, 0], rise: 0.8, duration-ticks: 20,
        scale: 1.0, spread: 0.25 }

# Crispy crit: golden flash shell, white firework sparks, extra crumbs, rising golden sparkles and a big number.
cookie_crit:
  layers:
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5a623", size: 1.4,
        shape: sphere, points: 16, radius-start: 0.25, radius: 0.75, duration-ticks: 3 }
    - { type: particle, particle: firework, shape: burst, points: 14, radius: 0.2, speed: 0.22 }
    - { type: particle, particle: item, item: cookie, item-model: "cookieclicker:cookie", shape: burst,
        points: 12, radius: 0.15, up-bias: 0.4, speed: 0.18 }
    - { type: particle, particle: dust, color: "#f5c542", size: 0.8, shape: sparkles, points: 6, radius: 0.6,
        height: 1.1, duration-ticks: 8, stagger-ticks: 4, delay-ticks: 2 }
    - { type: item-crumbs, item: cookie, item-model: "cookieclicker:cookie", count: 3, scale: 0.22,
        distance: 0.8, spread: 70, duration-ticks: 14 }
    - { type: floating-text, text: "<b><gradient:#fff2a8:#f5a623>+<amount></gradient></b>",
        origin: [0, 0.45, 0], rise: 1.0, duration-ticks: 30, scale: 1.8, overshoot: 1.3, pop-in-ticks: 4,
        fade-ticks: 8, spread: 0.1 }

# Bought a building: a golden ring that opens up around the clicked row, facing the buyer, plus a few
# rising sparkles and a small burst of sparks.
purchase:
  layers:
    - { type: particle, particle: dust, color: "#f5c542", size: 1.0, shape: ring, plane: facing,
        points: 16, radius-start: 0.25, radius: 0.55, duration-ticks: 3 }
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5c542", size: 0.7,
        shape: sparkles, points: 6, radius: 0.45, height: 0.9, duration-ticks: 8, stagger-ticks: 3,
        emit-every: 2, delay-ticks: 1 }
    - { type: particle, particle: firework, shape: burst, points: 8, radius: 0.1, speed: 0.12, delay-ticks: 1 }

# Squash/pop of the clicked cookie display: effects.pop(display, viewer). Scale only; the caller's spin and bob
# (translation and rotation) are kept. Squash 2 ticks, stretch 2 ticks, settle 3 ticks.
pop:
  layers:
    - { type: scale-pop, steps: [ { scale: [1.25, 0.75, 1.25], ticks: 2 },
                                  { scale: [0.92, 1.10, 0.92], ticks: 2 },
                                  { scale: 1, ticks: 3 } ] }

# ---- starter-house cinematic (all personal: viewer = the player watching their house go up) ----------------------
# Per-block effects take the block's bottom centre: (x + 0.5, y, z + 0.5).

# How effects.dropBlock animates each falling block: appears 4 blocks up, hangs 2 ticks, falls 6, pops up 0.25
# while squashing (wide and flat), settles in 2. Lands 12 ticks after the call; impact at tick 8.
house_block_drop:
  layers:
    - { type: block-drop, start-tick: 2, drop-height: 4.0, fall-ticks: 6, bounce-height: 0.25, bounce-ticks: 2,
        squash: [1.08, 0.85, 1.08], settle-ticks: 2, impact-effect: house_block_land, impact-particles: 4,
        brightness: auto, view-range: 1.0 }

# Small soft puff just outside the block's foot when it hits the ground. Played by the engine at every drop impact
# (impact-effect above), so code doesn't play it for dropped blocks. 8 particles.
house_block_land:
  layers:
    - { type: particle, particle: poof, shape: ring, points: 8, radius: 0.72, start-angle: 22.5,
        direction: outward, speed: 0.05, origin: [0, 0.08, 0] }

# First layer only (the foundation): a dusty ring rolls out over the ground from under the block, plus four low
# puffs. Play it in onImpact for blocks of the bottom layer. 28 particles.
house_foundation_dust:
  layers:
    - { type: particle, particle: dust, color: "#c9b79c", size: 1.5, shape: ring, points: 12, radius-start: 0.75,
        radius: 1.1, duration-ticks: 2, origin: [0, 0.1, 0] }
    - { type: particle, particle: poof, shape: ring, points: 4, radius: 0.8, start-angle: 45, direction: outward,
        speed: 0.1, origin: [0, 0.1, 0], delay-ticks: 1 }

# Construction sparkle: three light-gold sparks rise off the top of the freshly placed block and two wax glints
# twinkle around it. Play it per block in onLanded (when the real block appears). 20 particles.
house_sparkle:
  layers:
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5c542", size: 0.7,
        shape: sparkles, points: 3, radius: 0.7, height: 0.7, duration-ticks: 6, stagger-ticks: 4,
        origin: [0, 1.0, 0] }
    - { type: particle, particle: wax_on, count: 2, offset: 0.4, origin: [0, 1.1, 0], delay-ticks: 2 }

# The house is finished: a warm flash, white firework sparks, a fountain of totem confetti and four colours of
# tinted leaves that hang in a dome around the roof and flutter down over the next seconds. Play once at the top
# centre of the house (about 1 block above the roof ridge). 153 particles.
house_confetti:
  layers:
    - { type: particle, particle: flash, color: "#fff2a8", count: 1 }
    - { type: particle, particle: firework, shape: burst, points: 24, radius: 0.3, up-bias: 0.35, speed: 0.35 }
    - { type: particle, particle: totem_of_undying, shape: fountain, points: 24, spread: 40, speed: 0.7,
        delay-ticks: 1 }
    - { type: particle, particle: tinted_leaves, color: "#f5c542", shape: burst, direction: none, points: 26,
        radius: 1.8, up-bias: 0.6, duration-ticks: 4 }
    - { type: particle, particle: tinted_leaves, color: "#ff8fc8", shape: burst, direction: none, points: 26,
        radius: 2.6, up-bias: 0.6, duration-ticks: 4, delay-ticks: 1 }
    - { type: particle, particle: tinted_leaves, color: "#7fe3c4", shape: burst, direction: none, points: 26,
        radius: 3.4, up-bias: 0.6, duration-ticks: 4, delay-ticks: 2 }
    - { type: particle, particle: tinted_leaves, color: "#8ec5ff", shape: burst, direction: none, points: 26,
        radius: 4.2, up-bias: 0.6, duration-ticks: 4, delay-ticks: 3 }

# Chimney smoke, looped with effects.loop("house_chimney_smoke", chimneyTop, viewer): every 10 ticks one big
# campfire smoke puff drifts up (it lingers ~5 s, so ~10 puffs make a column) plus two small dark wisps. Sent in
# the extended range so it shows from across the plot. 3 particles per play = 6 per second.
house_chimney_smoke:
  loop-every: 10
  layers:
    - { type: particle, particle: campfire_cosy_smoke, direction: up, speed: 0.05, origin: [0, 0.1, 0],
        force: true }
    - { type: particle, particle: smoke, count: 2, offset: 0.08, speed: 0.01, origin: [0, 0.25, 0], force: true }

# ---- factory-makeover ------------------------------------------------------------------------------------------

# Roof-vent steam, looped with effects.loop("factory_steam", ventTop, viewer) at every points.steam cell (location =
# centre of the vent's top face, like chimneyTop). Short white puffs, not a column: a 37-tick cycle (prime, so it
# never lines up with the 10-tick chimney smoke) with a big puff at 0, a small one at 5, a big one at 15 and a small
# one at 24, then a pause; each puff sits a few cm off centre. Cloud puffs fade in ~1 s, white_smoke wisps linger a
# little. Extended range (force) like the chimney. 8 particles per cycle = about 4.3 per second per vent.
factory_steam:
  loop-every: 37
  layers:
    - { type: particle, particle: cloud, direction: up, speed: 0.09, origin: [0, 0.15, 0], force: true }
    - { type: particle, particle: white_smoke, count: 2, offset: 0.06, speed: 0.01, origin: [0, 0.3, 0],
        force: true }
    - { type: particle, particle: cloud, direction: up, speed: 0.06, origin: [0.07, 0.15, -0.04], force: true,
        delay-ticks: 5 }
    - { type: particle, particle: cloud, direction: up, speed: 0.11, origin: [-0.05, 0.15, 0.05], force: true,
        delay-ticks: 15 }
    - { type: particle, particle: white_smoke, count: 2, offset: 0.06, speed: 0.01, origin: [-0.05, 0.3, 0.05],
        force: true, delay-ticks: 15 }
    - { type: particle, particle: cloud, direction: up, speed: 0.05, origin: [0.03, 0.15, 0.06], force: true,
        delay-ticks: 24 }

# ---- conveyor-belt ---------------------------------------------------------------------------------------------

# A belt cookie lands on the pedestal: a tiny spray of cookie crumbs hops up and falls, and a small warm-white ring
# pops open around it (0.08 -> 0.22 over 2 ticks). Location = where the belt cookie vanishes (its centre at the
# pedestal end of the belt); viewer = the belt's owner. Fired once per arriving cookie, so it is capped per viewer
# with min-interval-ticks: at most 5 plays per second, extra arrivals land silently. 17 particles per play,
# no entities = at most 85 particles per second per viewer, only sent to that viewer.
belt_arrive:
  min-interval-ticks: 4
  layers:
    - { type: particle, particle: item, item: cookie, item-model: "cookieclicker:cookie", shape: burst,
        points: 5, radius: 0.06, up-bias: 0.55, speed: 0.1 }
    - { type: particle, particle: dust, color: "#fff2a8", size: 0.5, shape: ring, points: 6, radius-start: 0.08,
        radius: 0.22, duration-ticks: 2, start-angle: 30, origin: [0, 0.05, 0] }

# Bought a one-time upgrade: the icon pops out of the panel row. A bright gold-to-white ring snaps open facing the
# buyer, 4 white-gold sparkle trails rise, and 8 firework sparks burst. About 60 particles, 0 entities, buyer only.
# Placeholders are accepted and unused (like the others).
upgrade_bought:
  layers:
    - { type: particle, particle: dust_color_transition, color: "#ffffff", to-color: "#f5c542", size: 1.0,
        shape: ring, plane: facing, points: 12, radius-start: 0.15, radius: 0.5, duration-ticks: 3 }
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5c542", size: 0.6,
        shape: sparkles, points: 4, radius: 0.35, height: 0.8, duration-ticks: 8, stagger-ticks: 3,
        emit-every: 2, delay-ticks: 1 }
    - { type: particle, particle: firework, shape: burst, points: 8, radius: 0.08, speed: 0.12 }

# The upgrade icon lands on the shelf: a tiny glint (end_rod flecks and a small warm ring). 10 particles, 0 entities.
upgrade_shelved:
  layers:
    - { type: particle, particle: end_rod, shape: burst, points: 4, radius: 0.05, speed: 0.03 }
    - { type: particle, particle: dust, color: "#fff2a8", size: 0.5, shape: ring, plane: facing, points: 6,
        radius-start: 0.05, radius: 0.16, duration-ticks: 2 }

# The cookie basket reached a higher tier (wicker -> bushel -> golden); play at the basket's bottom centre, viewer =
# owner. About 1.5 s: three gold rings climb the basket (heights 0.15/0.65/1.15, ticks 0/5/10), a double helix winds
# up 1.4 blocks (tick 0-24) and sparkles drift up. PEAK = tick 8: the end_rod + firework burst at 0.6 blocks high
# hides the model swap, so the coder switches the basket look 8 ticks after play. About 150 particles, 0 entities.
basket_tier_up:
  layers:
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5c542", size: 1.0,
        shape: ring, points: 10, radius-start: 0.5, radius: 0.85, duration-ticks: 2, origin: [0, 0.15, 0] }
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5c542", size: 1.0,
        shape: ring, points: 10, radius-start: 0.5, radius: 0.85, duration-ticks: 2, origin: [0, 0.65, 0], delay-ticks: 5 }
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5a623", size: 1.0,
        shape: ring, points: 10, radius-start: 0.5, radius: 0.85, duration-ticks: 2, origin: [0, 1.15, 0], delay-ticks: 10 }
    - { type: particle, particle: dust, color: "#f5c542", size: 0.8, shape: helix, points: 14, radius: 0.8,
        height: 1.4, turns: 1.5, strands: 2, duration-ticks: 24 }
    - { type: particle, particle: end_rod, shape: burst, points: 12, radius: 0.3, speed: 0.1, delay-ticks: 8,
        origin: [0, 0.6, 0] }
    - { type: particle, particle: firework, shape: burst, points: 8, radius: 0.3, speed: 0.07, delay-ticks: 8,
        origin: [0, 0.6, 0] }
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5c542", size: 0.6,
        shape: sparkles, points: 6, radius: 0.7, height: 1.0, duration-ticks: 10, stagger-ticks: 12,
        emit-every: 2, delay-ticks: 6 }

# A bakery building pops into its slot: a woody-beige dust ring rolls out at the base, a few low poofs and three
# light-gold sparks rise. About 0.6 s. Play at the building's bottom centre, viewer = owner. ~19 particles each, so
# a x10 buy (10 plays) stays near 190 particles total. 0 entities.
building_appear:
  layers:
    - { type: particle, particle: dust, color: "#d9b88a", size: 1.2, shape: ring, points: 6, radius-start: 0.3,
        radius: 0.8, duration-ticks: 2, origin: [0, 0.1, 0] }
    - { type: particle, particle: poof, shape: ring, points: 4, radius: 0.5, start-angle: 45, direction: outward,
        speed: 0.08, origin: [0, 0.1, 0], delay-ticks: 1 }
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5c542", size: 0.6,
        shape: sparkles, points: 3, radius: 0.5, height: 0.8, duration-ticks: 8, stagger-ticks: 4,
        origin: [0, 0.3, 0], delay-ticks: 2 }

# A building's look upgrades: a gold ring at its base, gold sparkles drift up around it and a small end_rod burst
# twinkles at the peak (about tick 6). About 1.2 s. Play at the building's bottom centre on every visible instance
# of the type, viewer = owner. ~45 particles each (10 instances = ~450, spread over time). 0 entities.
building_milestone:
  layers:
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5c542", size: 0.9,
        shape: ring, points: 8, radius-start: 0.6, radius: 0.7, duration-ticks: 2, origin: [0, 0.2, 0] }
    - { type: particle, particle: dust_color_transition, color: "#fff2a8", to-color: "#f5a623", size: 0.7,
        shape: sparkles, points: 5, radius: 0.7, height: 1.4, duration-ticks: 16, stagger-ticks: 8,
        emit-every: 3, origin: [0, 0.2, 0] }
    - { type: particle, particle: end_rod, shape: burst, points: 6, radius: 0.3, speed: 0.06, delay-ticks: 6,
        origin: [0, 0.8, 0] }

# ---- admin tools (not seen by normal players) ----------------------------------------------------------------------
# /bakery plot show: code plays one of these per outline point (up to ~120 points per region, redrawn every
# 20 ticks), viewer = the admin. One fat dust mote per play, sent in the extended range so the whole outline shows
# from across the plot. Sky blue = plot region, cookie gold = house region. 1 particle per play.
plot_outline:
  layers:
    - { type: particle, particle: dust, color: "#8ec5ff", size: 1.5, force: true }
house_outline:
  layers:
    - { type: particle, particle: dust, color: "#f5c542", size: 1.5, force: true }
