# Conveyor belt frame style for /bakery plot setup. GENERATED by design/scripts/belt_style.py; do not edit by hand.
# Spec: design/conveyor-belt.md. Belt cells come from `layout.belt` in factory.yml; the belt runs north (-Z) only.
# surface-height: frame column height per belt cell, from y 0 (first air layer); the `item-model` display sits at
#   (x + 0.5, ground + surface-height, z + 0.5), transform NONE, scale 1; cookies ride 0.0625 higher (rubber thickness).
# columns: block data lists, bottom -> top. first = hatch cell, last = pedestal end, middle repeats from the 2nd cell:
#   cell i uses middle[(i - 1) % len(middle)]. Only the belt cells change, so backup/undo cover exactly those.
